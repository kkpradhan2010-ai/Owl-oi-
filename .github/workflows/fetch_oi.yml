name: Fetch Live F&O OI

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and process live OI
        run: |
          python - << 'EOF'
          import requests
          import json
          from datetime import datetime

          symbols = [
              "RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", 
              "KOTAKBANK", "LT", "AXISBANK", "TATAMOTORS", "BAJFINANCE", "MARUTI", "SUNPHARMA",
              "TITAN", "NTPC", "TATASTEEL", "M&M", "ADANIENT", "COALINDIA", "BAJAJFINSV", "TECHM",
              "HCLTECH", "ONGC", "WIPRO", "VEDL", "HEROMOTOCO", "GRASIM", "DIVISLAB", "CIPLA"
          ]

          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br"
          }
          
          try:
              session.get("https://www.nseindia.com", headers=headers, timeout=10)
          except Exception:
              pass

          results = []
          for sym in symbols:
              try:
                  url = f"https://www.nseindia.com/api/option-chain-equities?symbol={sym}"
                  res = session.get(url, headers=headers, timeout=10)
                  data = res.json()
                  ce_oi = 0
                  pe_oi = 0
                  if "filtered" in data and "data" in data["filtered"]:
                      for item in data["filtered"]["data"]:
                          if "CE" in item: ce_oi += item["CE"].get("openInterest", 0)
                          if "PE" in item: pe_oi += item["PE"].get("openInterest", 0)
                      diff = pe_oi - ce_oi
                      results.append({"symbol": sym, "callOI": ce_oi, "putOI": pe_oi, "diff": diff})
              except Exception:
                  continue

          out = {
              "last_updated": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
              "stocks": results
          }

          with open("live_oi.json", "w") as f:
              json.dump(out, f, indent=2)
          print("Updated live_oi.json successfully!")
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_oi.json
          git commit -m "Auto-update live OI data [skip ci]" || exit 0
          git push
