name: Fetch Live F&O Real Data

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-live-nse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Network Engines
        run: |
          pip install requests curl_cffi

      - name: Execute Live Scrape
        run: |
          python - << 'EOF'
          import json
          import time
          from datetime import datetime
          from curl_cffi import requests

          symbols = [
              "RELIANCE", "HDFCBANK", "ICICIBANK", "SBIN", "INFY", "TCS", 
              "BHARTIARTL", "ITC", "LT", "KOTAKBANK", "AXISBANK", "TATAMOTORS", 
              "BAJFINANCE", "MARUTI", "TATASTEEL", "M&M", "ADANIENT", "COALINDIA",
              "NTPC", "TITAN", "SUNPHARMA", "BAJAJFINSV", "ONGC", "WIPRO"
          ]

          session = requests.Session(impersonate="chrome120")
          headers = {
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          # 1. NSE होमपेज से कुकी और ऑथेंटिकेशन टोकन लेना
          try:
              session.get("https://www.nseindia.com", headers=headers, timeout=15)
              time.sleep(1)
              session.get("https://www.nseindia.com/option-chain", headers=headers, timeout=15)
              time.sleep(2)
          except Exception as e:
              print(f"Init Warning: {e}")

          stock_results = []

          for sym in symbols:
              try:
                  url = f"https://www.nseindia.com/api/option-chain-equities?symbol={sym}"
                  resp = session.get(url, headers={"Referer": "https://www.nseindia.com/option-chain"}, timeout=15)
                  
                  if resp.status_code == 200:
                      data = resp.json()
                      records = data.get("records", {})
                      underlying_price = records.get("underlyingValue", 0)
                      
                      chain_data = data.get("filtered", {}).get("data", [])
                      if not chain_data:
                          chain_data = records.get("data", [])

                      ce_total_oi = 0
                      pe_total_oi = 0

                      for row in chain_data:
                          if "CE" in row:
                              ce_total_oi += row["CE"].get("openInterest", 0)
                          if "PE" in row:
                              pe_total_oi += row["PE"].get("openInterest", 0)

                      if underlying_price > 0 and (ce_total_oi > 0 or pe_total_oi > 0):
                          diff = pe_total_oi - ce_total_oi
                          stock_results.append({
                              "symbol": sym,
                              "ltp": underlying_price,
                              "callOI": ce_total_oi,
                              "putOI": pe_total_oi,
                              "diff": diff
                          })
                          print(f"OK: {sym} -> LTP: {underlying_price} | Diff: {diff}")
                  time.sleep(1)
              except Exception as err:
                  print(f"Skip {sym}: {err}")
                  time.sleep(1)

          payload = {
              "last_updated": datetime.now().strftime("%d-%m-%Y %H:%M:%S UTC"),
              "stocks": stock_results
          }

          with open("live_oi.json", "w") as f:
              json.dump(payload, f, indent=2)

          print(f"Completed! Total live stocks captured: {len(stock_results)}")
          EOF

      - name: Commit Live Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_oi.json
          git commit -m "Live market feed update [skip ci]" || exit 0
          git push
