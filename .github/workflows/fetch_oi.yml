name: Fetch Live F&O Real Data

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance

      - name: Fetch Verified Market Data
        run: |
          python - << 'EOF'
          import json
          import time
          from datetime import datetime
          import yfinance as yf

          # F&O के प्रमुख स्टॉक्स
          symbols = [
              "RELIANCE.NS", "HDFCBANK.NS", "ICICIBANK.NS", "SBIN.NS", "INFY.NS", 
              "TCS.NS", "BHARTIARTL.NS", "ITC.NS", "LT.NS", "KOTAKBANK.NS", 
              "AXISBANK.NS", "TATAMOTORS.NS", "BAJFINANCE.NS", "MARUTI.NS", 
              "TATASTEEL.NS", "M&M.NS", "ADANIENT.NS", "COALINDIA.NS"
          ]

          stock_results = []

          for s in symbols:
              clean_sym = s.replace(".NS", "")
              try:
                  ticker = yf.Ticker(s)
                  # लाइव प्राइस
                  fast_info = ticker.fast_info
                  ltp = round(fast_info.last_price, 2)
                  
                  # ऑप्शंस एक्सपायरी डेट्स
                  expirations = ticker.options
                  if expirations:
                      # सबसे नजदीकी एक्सपायरी का लाइव चेन
                      opt = ticker.option_chain(expirations[0])
                      calls = opt.calls
                      puts = opt.puts
                      
                      total_ce_oi = int(calls['openInterest'].fillna(0).sum())
                      total_pe_oi = int(puts['openInterest'].fillna(0).sum())
                      diff = total_pe_oi - total_ce_oi
                      
                      stock_results.append({
                          "symbol": clean_sym,
                          "ltp": ltp,
                          "callOI": total_ce_oi,
                          "putOI": total_pe_oi,
                          "diff": diff
                      })
                      print(f"Success: {clean_sym} -> LTP: {ltp}, Diff: {diff}")
              except Exception as e:
                  print(f"Error on {clean_sym}: {e}")
              time.sleep(0.5)

          payload = {
              "last_updated": datetime.now().strftime("%d-%m-%Y %H:%M:%S IST"),
              "stocks": stock_results
          }

          with open("live_oi.json", "w") as f:
              json.dump(payload, f, indent=2)

          print(f"Saved {len(stock_results)} verified real stocks.")
          EOF

      - name: Commit Live Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_oi.json
          git commit -m "Real market feed update [skip ci]" || exit 0
          git push
