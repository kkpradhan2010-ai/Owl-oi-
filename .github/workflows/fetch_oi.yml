name: Fetch Live F&O Real Data

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-kotak-neo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Fetch Real Market Data via Kotak Neo
        env:
          CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.KOTAK_CONSUMER_SECRET }}
          MOBILE_NUMBER: ${{ secrets.KOTAK_MOBILE_NUMBER }}
          PASSWORD: ${{ secrets.KOTAK_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          import json
          import time
          import requests
          from datetime import datetime

          token = os.environ.get("CONSUMER_KEY")

          if not token:
              print("Missing Kotak Neo token. Check GitHub Settings.")
              exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "accept": "application/json"
          }

          symbols = [
              "RELIANCE", "HDFCBANK", "ICICIBANK", "SBIN", "INFY", "TCS",
              "BHARTIARTL", "ITC", "LT", "KOTAKBANK", "AXISBANK", "TATAMOTORS",
              "BAJFINANCE", "MARUTI", "TATASTEEL", "M&M"
          ]

          stock_results = []

          # Kotak Neo Live Scrip Search & Quotes API
          for sym in symbols:
              try:
                  url = f"https://gw-napi.kotaksecurities.com/Quotes/2.0/Equity/QuoteSearch?symbol={sym}&exchange=NSE"
                  res = requests.get(url, headers=headers, timeout=10)
                  
                  ltp = 0
                  if res.status_code == 200:
                      d = res.json()
                      ltp = float(d.get("data", {}).get("ltp", 0) or 0)
                  
                  # ऑप्शन चेन फेच
                  chain_url = f"https://gw-napi.kotaksecurities.com/OptionChain/1.0/OptionChain?symbol={sym}&exchange=NSE"
                  c_res = requests.get(chain_url, headers=headers, timeout=10)
                  
                  call_oi = 0
                  put_oi = 0
                  if c_res.status_code == 200:
                      chain_data = c_res.json().get("data", [])
                      for strike in chain_data:
                          call_oi += int(strike.get("ce_oi", 0) or 0)
                          put_oi += int(strike.get("pe_oi", 0) or 0)

                  if ltp > 0:
                      diff = put_oi - call_oi
                      stock_results.append({
                          "symbol": sym,
                          "ltp": round(ltp, 2),
                          "callOI": call_oi,
                          "putOI": put_oi,
                          "diff": diff
                      })
                      print(f"OK: {sym} | LTP: {ltp} | PE-CE Diff: {diff}")
              except Exception as e:
                  print(f"Error fetching {sym}: {e}")
              time.sleep(0.2)

          payload = {
              "last_updated": datetime.now().strftime("%d-%m-%Y %H:%M:%S IST"),
              "stocks": stock_results
          }

          with open("live_oi.json", "w") as f:
              json.dump(payload, f, indent=2)

          print(f"Total live stocks captured: {len(stock_results)}")
          EOF

      - name: Commit Real Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_oi.json
          git commit -m "Kotak Neo direct API update [skip ci]" || exit 0
          git push
